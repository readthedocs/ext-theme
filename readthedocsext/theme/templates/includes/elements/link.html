{% comment %}
  Documented in the template API reference:
  https://docs.ops.verbthenouns.com/projects/ext-theme/en/latest/api/templates.html#link
{% endcomment %}

<a href="{{ url }}"
   class="{{ class }}"
   {% if is_external %}target="_blank" rel="nofollow noopener noreferrer"{% endif %}
   {% if label %}data-content="{{ label }}" aria-label="{{ label }}"{% endif %}>
  {{ text }}
  {% if is_external %}
    <i class="fad fa-external-link small light gray middle aligned icon"></i>
  {% endif %}
</a>
