[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readthedocsext-theme"
version = "1.0.0"
description = "Read the Docs next generation theme"
readme = "README.rst"
license = "MIT"
authors = [{ name = "Read the Docs, Inc", email = "dev@readthedocs.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Framework :: Django",
]
dependencies = [
    "Django",
    "crispy-forms-semantic-ui",
]

[project.optional-dependencies]
docs = [
    "Sphinx>6",
    "sphinx_rtd_theme",
    # sphinx-js 5 crashes on JS classes without a description
    "sphinx-js>=4,<5",
]

[project.urls]
Homepage = "https://github.com/readthedocs/ext-theme"
